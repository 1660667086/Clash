# Mihomo / Clash Meta configuration
# The Shadowsocks server endpoint below is the IPv4 address provided by the user.
# IPv6 traffic and AAAA DNS resolution are enabled globally.

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true

lan-allowed-ips:
  - 0.0.0.0/0
  - ::/0

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fc00::/18
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "time.*.com"
    - "ntp.*.com"

proxies:
  - name: "SS-95.40.114.136"
    type: ss
    server: 95.40.114.136
    port: 80
    cipher: aes-256-gcm
    password: "f9RtK5hlFU"
    udp: false
    ip-version: dual

proxy-groups:
  - name: "节点选择"
    type: select
    proxies:
      - "SS-95.40.114.136"
      - DIRECT

rules:
  - MATCH,节点选择
