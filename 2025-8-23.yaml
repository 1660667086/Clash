# 国外 AI 分流配置；OpenClash 优化版；日期：2026-09-28
# AI-US -> rbcmdrsc -> 8.218.129.197:51650 -> 用户的美国中转出口
# HK-Proxy / Douyin-IP -> HK-Douyin -> 8.218.129.197:80 -> 香港
# 已列出的域名及其适用子域覆盖网页、手机与桌面客户端；未知域名仍可能遗漏。
# 共用的登录、验证码、存储、Bing/GitHub 主机也可能承载非 AI 请求；这些请求同走美国。
# 不依赖新增 AI 远程规则集；国内分流使用 OpenClash 的 GeoSite、原 GEOIP 数据和本地 1.yaml。
# 国内域名直连使用 OpenClash 的 GeoSite.dat 中国域名列表，需在插件内保持数据库可用。
# OpenClash 需运行在规则模式，且接管设备流量/DNS/UDP；本文件不会自动更改路由器防火墙。
# 启用后重启 OpenClash，手机重新连接 Wi-Fi 并完全退出后重开 AI App。
# 插件的 DNS / 嗅探覆写应保留本文件设置；自定义规则不得抢在 AI 规则前。
# DNS 设置不能决定网站看到的出口 IP；实际出口仍取决于命中节点及其中转。
# 此文件无法强制路由器接管设备自带的 VPN / 私密中继 / 加密 DNS。
# 资料：MetaCubeX/meta-rules-dat category-ai-!cn（下载后内嵌快照）
# https://help.openai.com/en/articles/9247338-network-recommendations-for-chatgpt-errors-on-web-and-apps
# https://code.claude.com/docs/en/network-config
# https://docs.github.com/en/copilot/reference/copilot-allowlist-reference
# https://cursor.com/docs/enterprise/network-configuration
# https://wiki.metacubex.one/en/config/sniff/
# https://wiki.metacubex.one/en/config/dns/

port: 7890
socks-port: 7891
redir-port: 7892
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090

dns:
  enable: true
  # OpenClash 默认 DNS 监听端口；插件设置可覆盖此项。
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: redir-host
  fake-ip-range: 198.18.0.1/16
  prefer-h3: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 节点自身解析独立，避免代理 DNS 的循环依赖。
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 命中直连规则后，使用国内 DNS 获取直连地址，避免香港备用解析影响下载 CDN。
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver-follow-policy: false
  # 普通国外域名的备用解析通过香港节点使用加密 DNS。
  fallback:
    - "https://1.1.1.1/dns-query#HK-Douyin"
    - "https://8.8.8.8/dns-query#HK-Douyin"
  # AI 域名若需由本机解析，固定通过 51650 查询，不使用香港备用 DNS。
  # Fake-IP 模式下，能由节点远程解析的连接仍交给相应节点处理。
  # YAML 锚点仅用于复用同一组 DNS 地址。
  nameserver-policy:
    "+.openai.com": &ai_us_dns
      - "https://1.1.1.1/dns-query#rbcmdrsc"
      - "https://8.8.8.8/dns-query#rbcmdrsc"
