# Clash Mi 多设备配置：唯一节点 SS-28326；使用规则模式。
# GEO 分类需客户端可用；代理节点未启用 UDP。
# 该配置包含代理密码，请仅发送给可信任的人。
# 原 IDM 专用入口与本地规则文件不适用于此独立配置，已移除。
# 抖音 snssdk.com、amemv.com 原有代理规则保留。
# 苹果账号与礼品卡结账走代理，使用时请复测。

allow-lan: false
mode: rule
log-level: info

dns:
  enable: true
  # DNS 监听地址由客户端管理。
  ipv6: false
  enhanced-mode: redir-host
  fake-ip-range: 198.18.0.1/16
  prefer-h3: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 节点自身解析独立，避免代理 DNS 的循环依赖。
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 命中直连规则后，使用国内 DNS 获取直连地址，避免代理备用解析影响下载 CDN。
  direct-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver-follow-policy: false
  # 普通国外域名的备用解析通过新节点使用加密 DNS。
  fallback:
    - "https://1.1.1.1/dns-query#SS-28326"
    - "https://8.8.8.8/dns-query#SS-28326"
  # AI 域名若需由本机解析，使用新节点进行加密 DNS 查询。
  # Fake-IP 模式下，能由节点远程解析的连接仍交给相应节点处理。
  # YAML 锚点仅用于复用同一组 DNS 地址。
