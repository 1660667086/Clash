sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  # 使用识别到的域名作为目标，减少客户端缓存旧 IP 对连接的影响。
  override-destination: true
  # 不嗅探代理节点的外层连接，避免混淆流量被误判。
  skip-dst-address:
    - 192.243.115.105/32
  sniff:
    HTTP:
      ports: [80, 8080]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

proxies:
  - name: SS-28326
    type: ss
    server: 38.65.95.153
    port: 53264
    cipher: aes-256-gcm
    password: "oTHrZzCIgd"
    plugin: obfs
    plugin-opts:
      mode: http
    udp: false

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - SS-28326

